<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/css/auth/sign_up.css">
</head>
<body>
    <div class="login-card">
        <h2>Регистрация</h2>
        <form id="authForm">
            <div class="input-group">
                <label for="firstName">Имя</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="input-group">
                <label for="lastName">Фамилия</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="input-group">
                <label for="class">Класс</label>
                <select id="class" required>
                    <option value="" disabled selected>Выберите класс</option>
                    <option value="7А">7А</option>
                    <option value="7Б">7Б</option>
                    <option value="7В">7В</option>
                    <option value="7Г">7Г</option>
                    <option value="7Д">7Д</option>
                </select>
            </div>
            <div class="input-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <button type="button" id="togglePassword">Показать</button>
                </div>
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="status"></p>
    </div>

    <script src="/static/js/auth/sign_up.js"></script>
</body>
</html>
